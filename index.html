<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더 커뮤니티 2 팬메이드 게임</title>
<meta name="description" content="〈더 커뮤니티2: 보이지 않는 손〉에 나온 게임을 웹으로 옮긴 비공식 팬메이드 게임. 팩트 땅따먹기, 명제 레이스.">
<meta property="og:type" content="website">
<meta property="og:title" content="더 커뮤니티 2 팬메이드 게임">
<meta property="og:description" content="팩트 땅따먹기 · 명제 레이스. 비공식 팬메이드 게임.">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d0e10'/%3E%3Crect x='8' y='8' width='22' height='22' fill='%23c9a045'/%3E%3Crect x='34' y='8' width='22' height='22' fill='%233f72d8'/%3E%3Crect x='8' y='34' width='22' height='22' fill='%23d5473c'/%3E%3Crect x='34' y='34' width='22' height='22' fill='%23ecebe6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 두 게임과 같은 어두운 석판. 제목 → 게임 카드 2장(각자 미리보기 그림) → 관련 링크. 단일 다크 테마. */
:root{
  --ink:#0d0e10; --slab:#17191c; --slab-2:#202328; --rule:#d9d6cf; --rule-dim:#4a4d53;
  --paper:#efece6; --muted:#8e9198;
  --t-white:#ecebe6; --t-gold:#c9a045; --t-blue:#3f72d8; --t-red:#d5473c; --warn:#f2c14e;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b1d21 0,transparent 60%),var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:calc(5vh + env(safe-area-inset-top,0px)) 48px;display:grid;gap:32px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,9vw,92px);line-height:.95;margin:8px 0 0;text-wrap:balance}
.lead{margin:14px 0 0;color:#cfccc5;max-width:58ch}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.game{display:grid;grid-template-rows:auto 1fr;color:inherit;text-decoration:none;background:var(--slab);border:1.5px solid var(--rule-dim);border-radius:2px;overflow:hidden;transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--rule);transform:translateY(-2px)}
.game:focus-visible{outline:2px solid var(--warn);outline-offset:3px}
.art{height:190px;background:#08090a;border-bottom:1.5px solid var(--rule-dim);display:grid;place-items:center;overflow:hidden;position:relative}
.body{padding:18px 20px 20px;display:grid;gap:10px;align-content:start}
.body h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,40px);line-height:1;margin:0}
.body p{margin:0;color:#cfccc5}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meta span{font-size:12px;color:var(--muted);border:1px solid var(--rule-dim);padding:2px 8px;border-radius:2px}
.play{margin-top:6px;justify-self:start;font-weight:700;border:1.5px solid var(--paper);padding:9px 18px;border-radius:2px}
.game:hover .play{background:var(--paper);color:var(--ink)}
/* 팩트 땅따먹기 미리보기: 7×7 판 */
.board{display:grid;grid-template-columns:repeat(7,18px);gap:3px;padding:10px;border:1.5px solid var(--rule)}
.board i{width:18px;height:18px;display:block;border:1px solid #3a3d42}
/* 명제 레이스 미리보기: 카드 한 줄 */
.cards{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;padding:0 14px;max-width:100%}
.card{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 10px;border-radius:3px;font-weight:700;font-size:14px;background:#f4f2ed;color:#111214;box-shadow:0 2px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35);white-space:nowrap}
.card.j{height:30px;padding:0 7px;font-size:12px;background:#050506;color:#f4f2ed;border:1px solid #5a5d63}
.beam{position:absolute;inset:0;background:radial-gradient(160px 120px at 30% 40%,rgba(255,236,200,.12),transparent 70%);pointer-events:none}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{display:inline-flex;align-items:center;gap:8px;color:var(--paper);text-decoration:none;border:1.5px solid var(--rule-dim);padding:8px 14px 8px 10px;font-size:14px;font-weight:500;border-radius:2px;transition:border-color .15s,background .15s}
.links a:hover{border-color:var(--rule);background:var(--slab)}
.links a:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.links svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.links svg .fill{fill:currentColor;stroke:none}
.links a.report{border-color:var(--t-gold);color:var(--t-gold)}
.links a.report:hover{background:var(--t-gold);color:var(--ink)}
.disclaimer{margin:0;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow">더 커뮤니티 2: 보이지 않는 손</div>
    <h1>전쟁</h1>
    <p class="lead">방송에서 보았던 두뇌싸움을 직접 경험해보세요.</p>
  </header>

  <section class="games" aria-label="게임 목록">
    <a class="game" href="./proposition-race/">
      <div class="art"><div class="beam"></div><div class="cards" id="cards" aria-hidden="true"></div></div>
      <div class="body">
        <h2>명제 레이스</h2>
        <p>지하 공간에서 카드를 찾아 참인 명제를 만드세요.</p>
        <div class="meta"><span>카드 조합</span><span>전·후반</span><span>AI 대전</span></div>
        <span class="play">시작하기</span>
      </div>
    </a>
    <a class="game" href="./fact-hopscotch/">
      <div class="art"><div class="board" id="board" aria-hidden="true"></div></div>
      <div class="body">
        <h2>팩트 땅따먹기</h2>
        <p>상식 O·X퀴즈를 맞히고 상대보다 더 많은 땅을 차지하세요.</p>
        <div class="meta"><span>7×7 문제판</span><span>3라운드</span><span>AI 대전</span></div>
        <span class="play">시작하기</span>
      </div>
    </a>
  </section>

  <nav class="links" aria-label="더 커뮤니티 2 관련 링크">
    <a href="https://thecommunity.co.kr/" target="_blank" rel="noopener" title="홈페이지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg><span>홈페이지</span></a>
    <a href="https://www.youtube.com/playlist?list=PLec4tvPMs22Y" target="_blank" rel="noopener" title="유튜브"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10 9.2v5.6l4.8-2.8z" class="fill"/></svg><span>유튜브</span></a>
    <a href="https://www.instagram.com/wavve.official" target="_blank" rel="noopener" title="인스타그램"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1" class="fill"/></svg><span>인스타그램</span></a>
    <a href="https://www.wavve.com/player/vod?contentid=C9901_C99000000192_01_0008.1" target="_blank" rel="noopener" title="웨이브"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9c2.4-2.4 4.8-2.4 7.2 0s4.8 2.4 7.2 0 4.8-2.4 4.6-.2"/><path d="M2.5 15c2.4-2.4 4.8-2.4 7.2 0s4.8 2.4 7.2 0 4.8-2.4 4.6-.2"/></svg><span>웨이브</span></a>
    <a class="report" href="https://forms.gle/siNd21puWwCDBgua8" target="_blank" rel="noopener" title="오류 제보"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg><span>오류 제보</span></a>
  </nav>
  <p class="disclaimer">웨이브(Wavve)의 〈더 커뮤니티2: 보이지 않는 손〉에 등장하는 게임으로 만든 비공식 팬메이드 게임입니다.</p>
</main>
<script src="./proposition-race/data.js"></script>
<script>
// 팩트 땅따먹기 미리보기: 네 그룹 색이 섞인 7×7 판
(function(){
  const cols=["var(--t-white)","var(--t-gold)","var(--t-blue)","var(--t-red)",null,null];
  document.getElementById("board").innerHTML=Array.from({length:49},()=>{const c=cols[Math.floor(Math.random()*cols.length)];return `<i${c?` style="background:${c};border-color:${c}"`:""}></i>`}).join("");
})();
// 명제 레이스 미리보기: 새로고침마다 무작위 참 명제
(function(){
  let A="한국",B="일본",k="총인구",p="적다";
  const D=window.MR_DATA;
  if(D){for(let n=0;n<500;n++){
    const ks=Object.keys(D.keywords),kk=ks[Math.floor(Math.random()*ks.length)],K=D.keywords[kk],pp=K.preds[Math.floor(Math.random()*K.preds.length)];
    const cs=[...D.countries].sort(()=>Math.random()-.5),a=K.v[cs[0]],b=K.v[cs[1]];
    if(a==null||b==null||Math.abs(a-b)<=(K.tie||0))continue;
    let diff=a-b;if(K.rankLower)diff=-diff;
    if((D.predicates[pp]>0)===(diff>0)){A=cs[0];B=cs[1];k=kk;p=pp;break}
  }}
  const r=()=>`transform:rotate(${(Math.random()*5-2.5).toFixed(1)}deg)`;
  document.getElementById("cards").innerHTML=[["",A],["j","은/는"],["",B],["j","보다"],["",k],["j","이/가"],["",p]].map(([t,v])=>`<span class="card ${t}" style="${r()}">${v}</span>`).join("");
})();
</script>
</body>
</html>
